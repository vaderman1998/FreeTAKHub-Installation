---
- name: "Include {{ ansible_distribution }}-specific variables"
  include_vars: "{{ ansible_distribution }}.yml"

- name: Include FTSConfig variables
  include_vars: "FTSConfig.yml"

# Default to this host's primary LAN IPv4. The old ifconfig.me lookup broke
# dual-stack hosts (the request went out over IPv6, putting an IPv6 literal
# into fts_public_ipv4 and producing unparseable http://v6:port/ URLs), and a
# WAN address is unreachable for LAN TAK clients behind NAT anyway. Cloud
# installs that need a public address should pass FTS_IP_CUSTOM to
# easy_install.sh (-> fts_ip_addr_extra).
- name: Set FTS address (this host's primary IPv4)
  set_fact:
    fts_public_ipv4: "{{ ansible_default_ipv4.address }}"
  when: fts_ip_addr_extra is undefined

- name: Set FTS address (user override)
  set_fact:
    fts_public_ipv4: "{{ fts_ip_addr_extra }}"
  when: fts_ip_addr_extra is defined

- name: Print IPv4
  debug:
    msg: "fts_public_ipv4 = {{ fts_public_ipv4 }}"

- name: Set localhost IPv4
  set_fact:
    fts_ipv4: 127.0.0.1

- name: Setup
  include_tasks: "setup-{{ ansible_distribution }}.yml"

- name: Configure
  include_tasks: "configure-{{ ansible_distribution }}.yml"
