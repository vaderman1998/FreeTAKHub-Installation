---
# The packaged config.py reads every setting from the environment, falling
# back to FTSConfig.yaml, so templating a copy over it is unnecessary and
# actively harmful: the template hardcoded SECRET_KEY, APIKEY and
# WEBSOCKETKEY, which made those impossible to configure per deployment.

- name: Template unit file
  template:
    src: fts-ui.service.j2
    dest: "{{ unit_files_location }}/{{ fts_ui_service_name }}.service"
    owner: root
    group: root
    mode: 0644

- name: Kill any currently running processes
  include_tasks: ../../common/tasks/kill.yml
  vars:
    process: "{{ fts_ui_install_path }}/run.py"

- name: Enable service
  service:
    name: "{{ fts_ui_service_name }}"
    enabled: "{{ fts_ui_enabled }}"
    use: systemd
  register: enable_fts_ui
  retries: 20
  until: enable_fts_ui is success

- name: Set service state
  service:
    name: "{{ fts_ui_service_name }}"
    state: "{{ fts_ui_state }}"
    use: systemd
  register: set_fts_ui_state
  retries: 20
  until: set_fts_ui_state is success
